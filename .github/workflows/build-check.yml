name: Build check

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Refresh OpenAPI spec from production
        run: |
          curl -fsSL https://claudeproject7-production.up.railway.app/openapi.json \
            -o openapi.json

      - name: Generate code (freezed / json_serializable / l10n)
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://claudeproject7-production.up.railway.app

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          file: build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"

      - name: Notify on success
        if: success()
        continue-on-error: true
        uses: dawidd6/action-send-mail@v3
        with:
          server_address: smtp.gmail.com
          server_port: 465
          username: ${{ secrets.MAIL_USERNAME }}
          password: ${{ secrets.MAIL_PASSWORD }}
          subject: "✅ Savi Nenapu build uploaded — ${{ github.ref_name }}"
          to: gopal.rms4@gmail.com
          from: Savi Nenapu CI <${{ secrets.MAIL_USERNAME }}>
          body: |
            A new debug APK has been uploaded to Firebase App Distribution.

            Branch:  ${{ github.ref_name }}
            Commit:  ${{ github.sha }}
            Run:     https://github.com/${{ github.repository }}/actions/runs/${{ github.run_id }}

            Install the latest build from Firebase App Distribution.
