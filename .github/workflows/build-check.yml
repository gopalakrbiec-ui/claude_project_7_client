name: Build check

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4.2.2

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: flutter pub get
        run: flutter pub get

      - name: Refresh OpenAPI spec from production
        run: |
          curl -fsSL https://claudeproject7-production.up.railway.app/openapi.json \
            -o openapi.json

      - name: Generate code (freezed / json_serializable / l10n)
        run: |
          flutter pub run build_runner build --delete-conflicting-outputs
          flutter gen-l10n

      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test

      - name: Build APK
        run: |
          flutter build apk --debug \
            --dart-define=API_BASE_URL=https://claudeproject7-production.up.railway.app

      - name: Upload to Firebase App Distribution
        uses: wzieba/Firebase-Distribution-Github-Action@v1
        with:
          appId: ${{ secrets.FIREBASE_APP_ID }}
          serviceCredentialsFileContent: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          groups: testers
          file: build/app/outputs/flutter-apk/app-debug.apk
          releaseNotes: "Branch: ${{ github.ref_name }} | Commit: ${{ github.sha }}"
