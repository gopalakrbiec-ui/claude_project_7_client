name: life_event_editor
description: AI life-event editing app for rural India.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.0.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3+1

  # State management
  flutter_riverpod: ^2.5.1
  riverpod_annotation: ^2.3.5

  # Routing
  go_router: ^13.2.1

  # Generated model support
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Secure storage
  flutter_secure_storage: ^9.2.2

  # Image caching
  cached_network_image: ^3.3.1

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # OpenAPI annotation (drives code-gen config only)
  openapi_generator_annotations: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  riverpod_generator: ^2.4.0
  openapi_generator: ^6.0.0

flutter:
  uses-material-design: true
  generate: true  # enables ARB-based localizations
