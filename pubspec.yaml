name: life_event_editor
description: AI life-event editing app for rural India.
publish_to: none
version: 1.0.0+1

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  # Networking
  dio: ^5.4.3+1

  # State management
  flutter_riverpod: ^2.5.1

  # Routing
  go_router: ^13.2.1

  # Generated model support (freezed + json_serializable under the hood)
  freezed_annotation: ^2.4.1
  json_annotation: ^4.9.0

  # Secure storage (JWT token)
  flutter_secure_storage: ^9.2.2

  # Image caching
  cached_network_image: ^3.3.1

  # i18n
  flutter_localizations:
    sdk: flutter
  intl: ^0.19.0

  # Locale preference (non-sensitive; shared_preferences is appropriate here)
  shared_preferences: ^2.2.3

  # OpenAPI generator annotation (drives build_runner codegen config)
  openapi_generator_annotations: ^6.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^3.0.0

  # Code generation
  build_runner: ^2.4.9
  freezed: ^2.5.2
  json_serializable: ^6.8.0
  openapi_generator: ^6.0.0

flutter:
  uses-material-design: true
  # Enables flutter gen-l10n via `flutter pub get` (requires l10n.yaml)
  generate: true
