// Root build.gradle — plugins are declared in settings.gradle (modern Flutter 3.x DSL).
// Per-module build config lives in android/app/build.gradle.

allprojects {
    repositories {
        google()
        mavenCentral()
        maven { url "https://maven.razorpay.com/nexus/content/repositories/releases" }
    }
}

rootProject.buildDir = "../build"
subprojects {
    project.buildDir = "${rootProject.buildDir}/${project.name}"
    project.evaluationDependsOn(":app")
}

tasks.register("clean", Delete) {
    delete rootProject.buildDir
}
