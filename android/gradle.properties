# ── Gradle JVM ──────────────────────────────────────────────────────────────
# 4 GB heap keeps large R8 full-mode optimisation runs from OOM-crashing.
org.gradle.jvmargs=-Xmx4096m -XX:+HeapDumpOnOutOfMemoryError -Dfile.encoding=UTF-8

# Parallel builds and configuration caching cut CI time significantly.
org.gradle.parallel=true
org.gradle.configureondemand=true
org.gradle.caching=true

# ── AndroidX ────────────────────────────────────────────────────────────────
android.useAndroidX=true
android.enableJetifier=true

# ── AGP compatibility ───────────────────────────────────────────────────────
# Flutter's Gradle plugin applies itself using the legacy `apply from:` path,
# which AGP 9+ rejects under its new DSL-only mode.  Opt out until Flutter
# ships a fully AGP-9-compatible plugin.
# See: https://developer.android.com/build/releases/agp-9-0-0-release-notes
android.newDsl=false

# ── R8 / shrinking ──────────────────────────────────────────────────────────
# Full mode enables R8's own optimiser rather than ProGuard-compat mode.
# It removes significantly more dead code and performs method inlining across
# class boundaries.  Safe for Flutter because the Dart → native AOT path does
# not use Java reflection; only the plugin layer (Razorpay, etc.) does.
android.enableR8.fullMode=true

# ── Kotlin ──────────────────────────────────────────────────────────────────
kotlin.code.style=official
