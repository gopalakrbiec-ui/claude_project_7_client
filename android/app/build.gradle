plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

// ── Release signing ──────────────────────────────────────────────────────────
// key.properties is NEVER committed to source control (see .gitignore).
// CI/CD writes it at build time from environment secrets.
// Developers generate a local keystore — see docs/release-signing.md.
def keyPropertiesFile = rootProject.file("key.properties")
def keyProperties = new Properties()
if (keyPropertiesFile.exists()) {
    keyPropertiesFile.withReader("UTF-8") { reader -> keyProperties.load(reader) }
}

android {
    namespace "in.yaadein.app"
    compileSdk 35

    defaultConfig {
        applicationId "in.yaadein.app"
        // API 21 = Android 5.0 (Lollipop) — covers 99 %+ of active Android
        // devices globally and is required by flutter_secure_storage.
        minSdk 21
        targetSdk 35
        versionCode flutterVersionCode.toInteger()
        versionName flutterVersionName

        // Multiline ndk split — only package architectures Play Store will
        // actually serve.  Omit x86 / x86_64 from production; emulators can
        // use debug builds.
        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }
    }

    signingConfigs {
        release {
            // All four values come from key.properties (never hardcoded).
            // CI writes this file from GitHub Actions secrets at build time.
            if (keyPropertiesFile.exists()) {
                storeFile     file(keyProperties["storeFile"])
                storePassword keyProperties["storePassword"]
                keyAlias      keyProperties["keyAlias"]
                keyPassword   keyProperties["keyPassword"]
            }
        }
    }

    buildTypes {
        debug {
            // Debug: no shrinking, fast iteration, debuggable.
            applicationIdSuffix ".debug"
            versionNameSuffix "-debug"
            debuggable true
        }

        release {
            signingConfig signingConfigs.release

            // ── Shrinking ────────────────────────────────────────────────────
            // minifyEnabled: runs R8 (full mode via gradle.properties) to
            //   remove unreachable Java/Kotlin code, inline methods, and
            //   obfuscate symbol names.  Typically saves 1–3 MB on the Java
            //   side of a Flutter app.
            minifyEnabled true

            // shrinkResources: removes Android resources (drawables, layouts,
            //   strings) not reachable from the Dart/Java code path.  Saves
            //   0.2–0.8 MB depending on how many unused res come in via
            //   plugins (Razorpay brings its own layouts and drawables).
            // Note: shrinkResources requires minifyEnabled = true.
            shrinkResources true

            proguardFiles(
                getDefaultProguardFile("proguard-android-optimize.txt"),
                "proguard-rules.pro"
            )

            // No separate APK splits here — we build an AAB for Play Store.
            // For direct APK distribution use the --split-per-abi flag at
            // the Flutter CLI level (documented in docs/release-signing.md).
        }
    }

    // ── AAB / APK splits ─────────────────────────────────────────────────────
    // For Play Store, `flutter build appbundle` creates an optimised AAB.
    // Play Store automatically delivers a split APK containing only the user's
    // ABI — no manual splits block needed.
    //
    // For direct APK delivery (outside Play Store) use this block instead:
    //   splits {
    //       abi {
    //           enable true
    //           reset()
    //           include "armeabi-v7a", "arm64-v8a"
    //           universalApk false   // skip the fat APK; saves ~40 % per device
    //       }
    //   }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    kotlinOptions {
        jvmTarget = "1.8"
    }

    // Strip debug symbols from release native libraries — saves ~1–2 MB in
    // the APK without affecting crash symbolication (Play Store accepts
    // unstripped debug symbols separately for stack trace resolution).
    packagingOptions {
        // Remove duplicate licence files that inflate APK size.
        excludes += [
            "META-INF/LICENSE",
            "META-INF/LICENSE.txt",
            "META-INF/NOTICE",
            "META-INF/NOTICE.txt",
            "**/DebugProbesKt.bin",  // Kotlin coroutines debug metadata
        ]
    }
}

flutter {
    source "../.."
}

dependencies {
    // No additional Java/Kotlin dependencies — everything is via Flutter plugins.
}
